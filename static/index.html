<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peer-Mentor Review Survey</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Custom Alert Box CSS */
    .custom-alert {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: white;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      z-index: 1000;
    }

    .custom-alert p {
      margin: 0 0 20px;
    }

    .custom-alert button {
      background-color: red;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
    }

    .custom-alert button:hover {
      background-color: darkred;
    }

    .alert-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
    }
  </style>
</head>
<body>
  <section class="container">
    <header>Peer-Mentor Review Survey</header>
    <form id="contact-form" action="http://127.0.0.1:5001/submit-form" method="POST" class="form" onsubmit="submitForm(event)" enctype="multipart/form-data">
      <div class="input-box">
        <label>Full Name</label>
        <input type="text" id="full_name" name="full_name" placeholder="Enter full name" required />
      </div>
      <div class="input-box">
        <label>Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter email address" required />
      </div>
      <div class="input-box">
        <label>Journal Title Reviewed:</label>
        <input type="text" id="journal" name="journal" placeholder="Enter journal title" required />
      </div>
      <div class="input-box">
        <label>Article Title (Peer Reviewed)</label>
        <input type="text" id="article" name="article" placeholder="Enter article title" required />
      </div>
      <div class="input-box">
        <label>Mentor's Full Name</label>
        <input type="text" id="mentor" name="mentor" placeholder="Enter mentor's full name" required />
      </div>
      <div class="input-box">
        <label>Mentor's Email Address</label>
        <input type="email" id="mentor_email" name="mentor_email" placeholder="Enter mentor's email address" required />
      </div>
      <div class="input-box">
        <label>Upload Certificate</label>
        <input type="file" id="certificate" name="certificate" accept=".pdf,.doc,.docx"  />
      </div>
      
      <button type="submit">Submit</button>
    </form>
  </section>

  <div class="alert-overlay"></div>
  <div class="custom-alert">
    <p>Your survey was submitted successfully!</p>
    <button onclick="closeAlert()">OK</button>
  </div>

  <script>
    // Function to submit the form and send data to the backend
    function submitForm(event) {
      event.preventDefault();

      // Create FormData object to include text inputs and file
      var formData = new FormData(document.getElementById("contact-form"));

      // Send the form data to the backend API
      fetch('http://127.0.0.1:5001/submit-form', {
        method: 'POST',
        body: formData
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('Form submission failed.');
        }
        return response.json();
      })
      .then(data => {
        console.log('Form submission successful', data);
        document.getElementById("contact-form").reset();
        showAlert();
      })
      .catch(error => {
        console.error('Error submitting form:', error);
        alert('An error occurred while submitting the form. Please try again.');
      });
    }

    // Show success alert
    function showAlert() {
      document.querySelector('.alert-overlay').style.display = 'block';
      document.querySelector('.custom-alert').style.display = 'block';
    }

    // Close success alert
    function closeAlert() {
      document.querySelector('.alert-overlay').style.display = 'none';
      document.querySelector('.custom-alert').style.display = 'none';
    }
  </script>
</body>
</html>
